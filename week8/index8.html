<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard</title>
    <link rel="stylesheet" href="index8.css">
</head>
<body>
    <main class="dashboard">
        <header class="dashboard-header">
            <h1>My Dashboard</h1>
        </header>

        <nav class="menu" aria-label="Main menu">
            <h2>Menu</h2>
            <ul>
                <li>Home</li>
                <li>Reports</li>
                <li>Settings</li>
            </ul>
        </nav>
        <section class="metrics" aria-label="Dashboard metrics">
            <article class="metric">
                <span class="metric-icon" aria-hidden="true">👤</span>
                <p><strong>120</strong><span>Users</span></p>
            </article>
            <article class="metric">
                <span class="metric-icon" aria-hidden="true">💰</span>
                <p><strong>Rs 45k</strong><span>Sales</span></p>
            </article>
            
        </section>

        <footer class="dashboard-footer">Made with CSS Grid</footer>

        
    </main>
</body>
</html>
